<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>REAPER</title>
<style>html,body{background:#000;color:#35ff6b;font-family:"Courier New",monospace;font-size:12px}</style></head>
<body>LOADING...<script>
fetch('./app.html?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){document.open();document.write(h);document.close()}).catch(function(){document.body.textContent='NO SIGNAL - PRESS SIDE BUTTON';window.addEventListener('sideClick',function(){location.reload()})});
</script></body></html>
